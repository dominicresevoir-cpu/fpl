{% extends "base.html" %}
{% block title %}{{ title }} · FPL Agent{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  {% if html %}
    <article class="report">{{ html | safe }}</article>
  {% else %}
    <p class="empty">No report has been generated yet. Try <a href="/run">running analysis now</a>,
       or wait for the next scheduled run.</p>
  {% endif %}
{% endblock %}
